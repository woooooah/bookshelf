services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
    # --reload: ob spremembi kode se streznik sam ponovno zazene
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
